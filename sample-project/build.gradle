buildscript {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        mavenCentral()
    }

    def groupProp = gradle.startParameter.projectProperties["group"] ?: "io.github.noncoderf.archguard"
    def versionProp = gradle.startParameter.projectProperties["version"] ?: "0.1.2"
    def groupPath = groupProp.replace('.', '/')
    def userHome = System.getProperty("user.home")
    def m2Jar = file("${userHome}/.m2/repository/${groupPath}/archguard-plugin/${versionProp}/archguard-plugin-${versionProp}.jar")

    def userDir = System.getProperty("user.dir")
    def localJar = file("${userDir}/archguard-plugin/build/libs/archguard-plugin-0.1.2.jar")

    if (m2Jar.exists()) {
        dependencies {
            classpath("$groupProp:archguard-plugin:$versionProp")
        }
    } else if (localJar.exists()) {
        dependencies {
            classpath(files(localJar))
        }
    }
}

plugins {
    id 'org.jetbrains.kotlin.jvm'
}

apply plugin: "io.github.noncoderf.archguard.gradle"

archGuard {
    reports {
        html {
            enabled = true
            outputPath = "archguard-report.html"
        }
    }

    architecture {
        featureRoot = "feature"

        feature("login") {
            requiredLayer("presentation")
            requiredLayer("domain")
            requiredLayer("data")

            feature("chat") {
                requiredLayer("ui")
                requiredLayer("socket")
            }
        }
    }
}

tasks.register("archGuardCheck") {
    group = "verification"
    description = "Runs the ArchGuard architecture check for the sample project."
    dependsOn("architectureCheck")
}

dependencies {
    testImplementation "org.jetbrains.kotlin:kotlin-test"
}

tasks.test {
    useJUnitPlatform()
}
